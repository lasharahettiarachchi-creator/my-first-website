<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Snake Game with Firebase</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 450px; width: 100%; }
        h1 { margin-top: 0; color: #4ade80; }
        .btn { background: #22c55e; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; }
        .btn:hover { background: #16a34a; }
        input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 10px; text-align: center; font-size: 1.1rem; }
        canvas { background: #020617; border: 2px solid #334155; border-radius: 0.5rem; margin-top: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .status { margin-top: 10px; font-weight: bold; color: #38bdf8; min-height: 24px; }
        .hidden { display: none !important; }
        .code-display { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 1.8rem; font-weight: bold; letter-spacing: 4px; color: #4ade80; margin: 10px 0; border: 2px dashed #4ade80; }
        .scores { display: flex; justify-content: space-around; margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="card" id="lobby">
    <h1>🐍 Firebase Snake</h1>
    <p>Room එකක් සාදා Room Code එක අනෙක් කෙනාට දෙන්න.</p>
    
    <button class="btn" onclick="createRoom()">Create Room</button>
    
    <!-- Room Code Display Area -->
    <div id="host-area" class="hidden">
        <p style="margin-bottom: 5px; color: #38bdf8;">Your Room Code:</p>
        <div class="code-display" id="my-code">generating...</div>
        <p style="font-size:0.9rem; color:#facc15;" id="waiting-text">⏳ Waiting for Player 2 to join...</p>
    </div>

    <hr style="border-color:#334155; margin:20px 0;">

    <input type="text" id="room-input" placeholder="Enter Room Code">
    <button class="btn" style="background:#0284c7;" onclick="joinRoom()">Join Room</button>
    <div class="status" id="lobby-status"></div>
</div>

<div class="card hidden" id="game">
    <h2>🐍 Live Snake Battle</h2>
    <div class="scores">
        <span style="color:#4ade80;" id="p1-score">P1 Score: 0</span>
        <span style="color:#60a5fa;" id="p2-score">P2 Score: 0</span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="status" id="game-status">Use Arrow Keys to Move!</div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://snake-6e0ae-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomCode = '';
    let myRole = ''; 

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = 20;

    let snake1 = [{x: 5, y: 10}];
    let dir1 = {x: 1, y: 0};
    let score1 = 0;

    let snake2 = [{x: 15, y: 10}];
    let dir2 = {x: -1, y: 0};
    let score2 = 0;

    let food = {x: 10, y: 10};
    let gameInterval = null;

    function createRoom() {
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        const hostArea = document.getElementById('host-area');
        hostArea.classList.remove('hidden');
        document.getElementById('my-code').innerText = roomCode;

        myRole = 'p1';

        db.ref('rooms/' + roomCode).set({
            snake1: snake1,
            snake2: snake2,
            dir1: dir1,
            dir2: dir2,
            food: food,
            score1: 0,
            score2: 0,
            status: 'waiting'
        });

        listenForGame();
    }

    function joinRoom() {
        const inputCode = document.getElementById('room-input').value.trim();
        if(!inputCode) {
            document.getElementById('lobby-status').innerText = "Please enter Room Code!";
            return;
        }
        roomCode = inputCode;
        myRole = 'p2';

        db.ref('rooms/' + roomCode).once('value', (snapshot) => {
            if (snapshot.exists()) {
                // Immediately start listening and update status to playing
                listenForGame();
                db.ref('rooms/' + roomCode).update({ status: 'playing' });
            } else {
                document.getElementById('lobby-status').innerText = "Room not found!";
            }
        });
    }

    function listenForGame() {
        db.ref('rooms/' + roomCode).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            snake1 = data.snake1 || snake1;
            snake2 = data.snake2 || snake2;
            score1 = data.score1 || 0;
            score2 = data.score2 || 0;
            food = data.food || food;
            dir1 = data.dir1 || dir1;
            dir2 = data.dir2 || dir2;

            updateScores();
            draw();

            if (data.status === 'playing') {
                startGameUI();
                if (myRole === 'p1' && !gameInterval) {
                    startHostLoop();
                }
            }
        });
    }

    function startGameUI() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
    }

    function startHostLoop() {
        gameInterval = setInterval(() => {
            let head1 = {x: snake1[0].x + dir1.x, y: snake1[0].y + dir1.y};
            snake1.unshift(head1);
            if (head1.x === food.x && head1.y === food.y) {
                score1 += 10;
                spawnFood();
            } else {
                snake1.pop();
            }

            let head2 = {x: snake2[0].x + dir2.x, y: snake2[0].y + dir2.y};
            snake2.unshift(head2);
            if (head2.x === food.x && head2.y === food.y) {
                score2 += 10;
                spawnFood();
            } else {
                snake2.pop();
            }

            db.ref('rooms/' + roomCode).update({
                snake1: snake1,
                snake2: snake2,
                food: food,
                score1: score1,
                score2: score2,
                dir1: dir1,
                dir2: dir2
            });
        }, 130);
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
    }

    function updateScores() {
        document.getElementById('p1-score').innerText = `Player 1: ${score1}`;
        document.getElementById('p2-score').innerText = `Player 2: ${score2}`;
    }

    function draw() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        ctx.fillStyle = '#4ade80';
        snake1.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));

        ctx.fillStyle = '#60a5fa';
        snake2.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));
    }

    window.addEventListener('keydown', e => {
        let newDir = null;
        if (e.key === 'ArrowUp') newDir = {x: 0, y: -1};
        if (e.key === 'ArrowDown') newDir = {x: 0, y: 1};
        if (e.key === 'ArrowLeft') newDir = {x: -1, y: 0};
        if (e.key === 'ArrowRight') newDir = {x: 1, y: 0};

        if (newDir && roomCode) {
            if (myRole === 'p1') {
                dir1 = newDir;
                db.ref('rooms/' + roomCode).update({ dir1: newDir });
            } else if (myRole === 'p2') {
                dir2 = newDir;
                db.ref('rooms/' + roomCode).update({ dir2: newDir });
            }
        }
    });
</script>
</body>
</html>
