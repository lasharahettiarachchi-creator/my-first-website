<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fast Multiplayer Tic-Tac-Toe</title>
    <!-- Ultra Fast Pub/Sub Network CDN -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 100%; }
        h1 { margin-top: 0; color: #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 10px; text-align: center; font-size: 1.1rem; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .cell { background: #334155; height: 90px; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; user-select: none; transition: background 0.1s; }
        .cell:hover { background: #475569; }
        .status { margin-top: 15px; font-weight: bold; color: #38bdf8; min-height: 24px; }
        .hidden { display: none; }
        .code-display { background: #0f172a; padding: 10px; border-radius: 5px; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: #4ade80; margin: 10px 0; word-break: break-all; }
    </style>
</head>
<body>

<div class="card" id="lobby">
    <h1>⚡ Ultra-Fast 2P Game</h1>
    <p>1 වෙනි Computer එකෙන් Create කරලා, 2 වෙනි Computer එකෙන් Join වෙන්න.</p>
    
    <button class="btn" onclick="createRoom()">Create Game Room</button>
    <div id="host-area" class="hidden">
        <p>ඔබේ Room Code එක:</p>
        <div class="code-display" id="my-code">---</div>
    </div>

    <hr style="border-color:#334155; margin:20px 0;">

    <input type="text" id="room-input" placeholder="Enter Room Code (e.g. 4521)">
    <button class="btn" style="background:#16a34a;" onclick="joinRoom()">Join Game Room</button>
    <div class="status" id="lobby-status"></div>
</div>

<div class="card hidden" id="game">
    <h2 id="role-display">Tic-Tac-Toe</h2>
    <div class="status" id="game-status">Connecting...</div>
    
    <div class="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
</div>

<script>
    // Free Realtime Cloud WebSocket Key
    const ably = new Ably.Realtime('8x2yLg.aR-4rA:Jk-zX89w1_xH6fM4');
    let channel = null;
    let mySymbol = '';
    let currentTurn = 'X';
    let boardState = Array(9).fill('');
    let gameActive = true;
    let roomCode = '';

    function createRoom() {
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('my-code').innerText = roomCode;
        document.getElementById('host-area').classList.remove('hidden');
        mySymbol = 'X';
        connectToChannel(roomCode);
    }

    function joinRoom() {
        const inputCode = document.getElementById('room-input').value.trim();
        if(!inputCode) {
            document.getElementById('lobby-status').innerText = "Please enter Room Code!";
            return;
        }
        roomCode = inputCode;
        mySymbol = 'O';
        connectToChannel(roomCode);
    }

    function connectToChannel(code) {
        document.getElementById('lobby-status').innerText = "Connecting WebSocket...";
        channel = ably.channels.get('room-' + code);

        channel.subscribe('move', (message) => {
            const data = message.data;
            boardState[data.index] = data.symbol;
            currentTurn = data.symbol === 'X' ? 'O' : 'X';
            updateUI();
            checkWin();
        });

        channel.subscribe('join', () => {
            if (mySymbol === 'X') {
                // Host notifies joiner
                channel.publish('start', { hostReady: true });
            }
        });

        channel.subscribe('start', () => {
            startGame();
        });

        if (mySymbol === 'O') {
            channel.publish('join', {});
            startGame();
        }
    }

    function startGame() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        document.getElementById('role-display').innerText = `You are Player: ${mySymbol}`;
        updateUI();
    }

    function makeMove(index) {
        if (!gameActive || boardState[index] !== '' || currentTurn !== mySymbol) return;

        // Instant local response + sync
        channel.publish('move', { index: index, symbol: mySymbol });
    }

    function updateUI() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach((cell, i) => {
            cell.innerText = boardState[i];
            cell.style.color = boardState[i] === 'X' ? '#f87171' : '#60a5fa';
        });

        if (gameActive) {
            if (currentTurn === mySymbol) {
                document.getElementById('game-status').innerText = "⚡ Your Turn!";
            } else {
                document.getElementById('game-status').innerText = "Waiting for opponent...";
            }
        }
    }

    function checkWin() {
        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        for (let condition of wins) {
            const [a, b, c] = condition;
            if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                gameActive = false;
                document.getElementById('game-status').innerText = `🎉 Player ${boardState[a]} Won!`;
                return;
            }
        }

        if (!boardState.includes('')) {
            gameActive = false;
            document.getElementById('game-status').innerText = "🤝 Game Draw!";
        }
    }
</script>
</body>
</html>
